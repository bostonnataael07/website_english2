<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Menulis - English Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #fafcff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: #333; }
        
        .top-header { background: #1565c0; color: white; padding: 15px 40px; display: flex; align-items: center; gap: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 10; }
        .btn-back { background: transparent; border: none; color: white; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; text-decoration: none; width: 30px; height: 30px; }
        .btn-back:hover { transform: translateX(-5px); }
        .page-title { font-size: 1.2rem; font-weight: 600; }

        .main-container { display: flex; gap: 30px; padding: 30px 40px; height: calc(100vh - 65px); }

        .typing-section { flex: 1; background: white; border-radius: 20px; padding: 30px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        .typing-section h2 { font-size: 1.5rem; color: #111; margin-bottom: 10px; }
        .typing-section p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        
        textarea { flex-grow: 1; resize: none; padding: 20px; border-radius: 12px; border: 2px solid #e3f2fd; font-size: 1rem; outline: none; transition: 0.3s; line-height: 1.6; }
        textarea:focus { border-color: #1565c0; }
        
        .btn-check { margin-top: 20px; padding: 15px; background: #1565c0; color: white; border: none; border-radius: 12px; font-weight: 600; font-size: 1.1rem; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-check:hover { background: #0d47a1; }
        .btn-check:disabled { background: #90caf9; cursor: not-allowed; }

        .result-section { flex: 1; background: #f8f9fa; border-radius: 20px; padding: 30px; border: 1px dashed #ccc; display: flex; flex-direction: column; overflow-y: auto; }
        .result-empty { margin: auto; text-align: center; color: #999; }
        .result-empty i { font-size: 4rem; color: #e0e0e0; margin-bottom: 15px; }
        
        .result-content { display: none; flex-direction: column; height: 100%; }
        .result-content h3 { color: #1565c0; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        
        .text-display { background: white; padding: 20px; border-radius: 12px; border: 1px solid #e0e0e0; line-height: 1.8; font-size: 1rem; margin-bottom: 20px; }
        
        .error-highlight { background-color: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 4px; border-bottom: 2px solid #ef5350; font-weight: 600; position: relative; cursor: pointer; }
        
        .feedback-card { background: white; padding: 15px 20px; border-radius: 10px; border-left: 5px solid #ef5350; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .feedback-card strong { color: #c62828; font-size: 1.1rem; display: block; margin-bottom: 5px; }
        .feedback-card p { color: #555; font-size: 0.9rem; margin: 0; line-height: 1.5; }

        .daily-quote { margin-top: auto; padding: 15px; border-radius: 12px; text-align: center; font-style: italic; font-weight: 500; font-size: 0.95rem; }
        .quote-motivation { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; }
        .quote-praise { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        
        .system-error { color: #d32f2f; background: #ffebee; padding: 15px; border-radius: 8px; font-weight: 500; text-align: center; }
        .error-detail { display: block; margin-top: 8px; font-size: 0.85rem; color: #555; font-weight: normal; }
    </style>
</head>
<body>

    <div class="top-header">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i></a>
        <div class="page-title">Writing Space</div>
    </div>

    <div class="main-container">
        <div class="typing-section">
            <h2>Writing Space</h2>
            <p>Ketik kalimat bahasa Inggris. AI akan mengecek grammar, tenses, dan ejaan secara otomatis.</p>
            <textarea id="userText" placeholder="Contoh: Yesterday I go to the market to buy some apple..."></textarea>
            <button class="btn-check" id="btnCheck">Cek Hasil <i class="fas fa-magic"></i></button>
        </div>

        <div class="result-section" id="resultContainer">
            <div class="result-empty" id="resultEmpty">
                <i class="fas fa-robot"></i>
                <h3>Hasil Analisis AI</h3>
                <p>Ketik tulisan bebas di kiri dan klik "Cek Hasil".</p>
            </div>

            <div class="result-content" id="resultContent">
                <h3><i class="fas fa-check-circle"></i> Analisis Selesai</h3>
                <div class="text-display" id="aiTextDisplay"></div>
                <div id="aiFeedbackList"></div>
                <div id="dailyQuoteBox" class="daily-quote"></div>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AIzaSyBVRzUgq53S351M4EXZQ4PCWZr0fj2crnw"; 
        const motivasiHarian = ["Kesalahan adalah bukti bahwa kamu sedang mencoba. Terus semangat belajar!", "Jangan takut salah grammar, native speaker juga sering salah kok. Gaskeun!", "Setiap ahli dulunya adalah seorang pemula. Keep practicing!", "Satu kesalahan hari ini adalah satu pelajaran berharga untuk besok.", "Bahasa itu alat komunikasi, yang penting berani mencoba dulu!", "Progress lebih penting daripada kesempurnaan. Kamu hebat!", "Salah tenses itu wajar, yang penting pesannya tersampaikan. Yuk perbaiki!"];
        const pujianHarian = ["Perfecto! Grammar dan vocab-nya rapi banget hari ini.", "Luar biasa! Nggak ada typo atau salah tenses sama sekali.", "Keren banget! Bahasa Inggrismu udah sekelas native speaker nih.", "Spot on! Kalimatmu terstruktur dengan sangat baik.", "Flawless! Pertahankan performa menulismu yang keren ini.", "Wow! AI sampai bingung mau ngoreksi apa, saking sempurnanya.", "Excellent! Tingkat akurasi tulisanmu 100%."];

        const btnCheck = document.getElementById('btnCheck');
        const userText = document.getElementById('userText');
        const resultEmpty = document.getElementById('resultEmpty');
        const resultContent = document.getElementById('resultContent');
        const aiTextDisplay = document.getElementById('aiTextDisplay');
        const aiFeedbackList = document.getElementById('aiFeedbackList');
        const dailyQuoteBox = document.getElementById('dailyQuoteBox');

        btnCheck.addEventListener('click', async function() {
            let textAsli = userText.value.trim();
            if(textAsli === "") { alert("Ketik sesuatu dulu dong Bosku!"); return; }

            btnCheck.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Otak AI Sedang Berpikir...';
            btnCheck.disabled = true;
            resultEmpty.style.display = 'none';
            resultContent.style.display = 'flex';
            aiTextDisplay.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menunggu balasan dari server AI...';
            aiFeedbackList.innerHTML = '';
            dailyQuoteBox.innerHTML = '';

            const promptUntukAI = `
                Kamu adalah guru bahasa Inggris. Periksa grammar, tenses, vocab, dan ejaan dari teks berikut: "${textAsli}"
                KEMBALIKAN OUTPUT HANYA DALAM FORMAT JSON SEPERTI CONTOH DI BAWAH INI. JANGAN ADA TEKS LAIN SAMA SEKALI.
                {
                    "ada_salah": true,
                    "teks_highlight": "teks asli pengguna, tapi SETIAP KATA YANG SALAH dibungkus dengan <span class='error-highlight' title='Jenis Error'>kata_salah</span>",
                    "penjelasan": [
                        {
                            "judul": "1. Salah Tenses (Atau jenis error lainnya)",
                            "deskripsi": "Penjelasan detail kenapa salah dan perbaikannya dalam bahasa Indonesia."
                        }
                    ]
                }
            `;

            try {
                const respon = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptUntukAI }] }] })
                });

                if (!respon.ok) throw new Error(`HTTP Error Status: ${respon.status} - Koneksi ke Google ditolak.`);
                const data = await respon.json();
                let teksJawabanAI = data.candidates[0].content.parts[0].text;
                const pencariJSON = teksJawabanAI.match(/\{[\s\S]*\}/);
                
                if(!pencariJSON) throw new Error("AI membalas dengan format yang salah (Bukan JSON).");

                const hasilAnalisis = JSON.parse(pencariJSON[0]);
                const hariIni = new Date().getDay();

                aiTextDisplay.innerHTML = hasilAnalisis.teks_highlight;

                if (hasilAnalisis.ada_salah && hasilAnalisis.penjelasan && hasilAnalisis.penjelasan.length > 0) {
                    let feedbackHTML = "";
                    hasilAnalisis.penjelasan.forEach(err => {
                        feedbackHTML += `<div class="feedback-card"><strong>${err.judul}</strong><p>${err.deskripsi}</p></div>`;
                    });
                    aiFeedbackList.innerHTML = feedbackHTML;
                    dailyQuoteBox.className = "daily-quote quote-motivation";
                    dailyQuoteBox.innerHTML = `💡 "${motivasiHarian[hariIni]}"`;
                } else {
                    aiFeedbackList.innerHTML = "";
                    dailyQuoteBox.className = "daily-quote quote-praise";
                    dailyQuoteBox.innerHTML = `🌟 "${pujianHarian[hariIni]}"`;
                }
            } catch (error) {
                console.error("Error Detail:", error);
                aiTextDisplay.innerHTML = `<div class="system-error"><i class="fas fa-exclamation-triangle"></i> Gagal memproses data AI.<span class="error-detail">Pesan Error: ${error.message}</span></div>`;
            } finally {
                btnCheck.innerHTML = 'Cek Hasil <i class="fas fa-magic"></i>';
                btnCheck.disabled = false;
            }
        });
    </script>
</body>
</html>
